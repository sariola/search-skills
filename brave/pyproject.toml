[project]
name = "brave"
version = "0.20.0"
description = "Advanced Brave Search for Prime Agent: blended mixed ranking, FAQ, embedded videos/discussions/news, real offset window (0..9), AI summary deep-link, grep/goggles, cluster sitelinks, infobox providers, enriched article metadata, research()/paged()/merge(), spellcheck, categorized errors with retry, software()/package lookup, video views + author channel, safety flags, locations map/POI + X-Loc-* geo, full freshness (pd/pw/pm/py/date-range), ui_lang/units/operators/include_fetch_metadata, modern goggles, round-7: breadcrumbs on results, discussion engagement metadata (num_answers, score, question, top_comment), forums()/probe()/crawl() helpers, creative_work ratings, inline location POI, inline FAQ, author metadata, geo-diagnostics, mutated_by_goggles flags, round-8: article/publisher identity + paywall flag, full weekly hours, price/rating/icon on locations, news/video/discussion fetch timestamps, headline/clip/picture lookups, open_now(), round-9: rich schema.org structured data on web results (recipe with ingredients/instructions/ratings, product with price/offers, movie with release/directors/actors/genre), content_type for file types (pdf), recipes()/products()/movies() subtype-aware helpers. round-10: rich() Rich Search API (weather/stock/crypto/FX/calculator/definitions/unit conversion/unix timestamp/sports), pois()/poi_descriptions() deep POI + AI descriptions. BRAVE_API_KEY. round-11: place_search() dedicated Place Search endpoint (POIs + city/country/region/neighborhood/address/street buckets + explore mode + radius + resolved-anchor), domain() site-scoped lookup, find_files() file-type search, news_cluster() source-grouped news digest, llm-context/answers/suggest/spellcheck/search documented OPTION_NOT_IN_PLAN gaps. round-12: summarize_page(url) clean extractive page digest, mosaic(query) cross-corpus digest (web+news+video+image in one call), image count up to 200 (pictures()/search cap), news up to 50 / video ~50 cap corrected, /res/v1/suggest/* verified ABSENT (301 redirect + OPTION_NOT_IN_PLAN). round-13: mosaic() cross-format fusion now also returns locations (map/POIs), video items carry a derived live flag (live/24-7 streams expose no duration), image search()/pictures() accept property licensing + search_type transparency hints (accepted; pass-through on this plan), place_search() accepts cate category hint (pass-through), newsflash() top-headlines digest, explain() one-call Markdown research brief, trending_topics() documented ABSENT (301 redirect). round-14: news depth — news rows surface breaking/is_live/is_source_local flags, news_breaking() breaking-headlines digest, news_beams() grouped publisher/beam view, brave.batch() parallel multi-query, brave.article_review() consensus good/bad/mixed brief from live page text, brave.search_worker() BFS crawl over web results + cluster sitelinks, related() documented ABSENT (no related-queries block; suggest 301). round-15: structured() one web SERP typed recipe/product/movie/software/discussion block pools with per-category counts, place_detail() one-call deep place dossier (place_search row + pois deep record + poi_descriptions AI blurb + geo-anchored nearby with computed straight-line km/m distances), news_live() live-coverage-only filter, consistent news age_meta (relative days / date kind) + published_at (ISO) across all news-carrying functions round-16: infobox() typed knowledge-panel fact table (clean field/value facts, entity_type + provider attribution), thumbnails() flattened thumbnail URLs across video+image webs, drinks() drink/cocktail recipe filter; news_regions / newsvine / discussion joinCount+nested reply depth / video playability / image thumbnail-cache documented as-absent or pass-through on this plan (live-verified). round-17: developer helpers -- docs() doc-biased query, code_result() code/Q&A surfacing with QA upvotes + top_comment, qna() stack-overflow/forum ranking, cve_lookup() advisory+news digest, breaking_change() freshness release/deprecation news roundup, dev_digest() Markdown brief (web+news+summarize_page), docker_aliases documented-absent (no docker index). round-18: developer powers -- pkg_lookup() package/registry identity + versions (software subtype), pkg_security() package advisory digest (snyk/cvedetails/GitHub-advisory/NVD rows + CVE ids + fresh news), error_solution() one-call best-answer digest for an error/stack string, stack_trace() linked GH-issues + SOA threads + articles for a stack snippet, dep_signal() classified deprecation/breaking/migration/removal/release news scan (by_type counts + threshold_days recency filter); trending_libs() documented-absent (no trending index). live-verified."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
brave = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brave"]
