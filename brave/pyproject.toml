[project]
name = "brave"
version = "0.20.0"
description = "Brave web, news, media, and local search Python client."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brave"]
