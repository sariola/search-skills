[project]
name = "exa"
version = "0.20.0"
description = "Exa search, content retrieval, cited research, and Websets Python client."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exa"]
